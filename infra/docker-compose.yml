services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sqc
      POSTGRES_PASSWORD: sqc
      POSTGRES_DB: sqc
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  pg-data:
