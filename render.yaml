services:
  - type: web
    name: security-questionnaire-api
    runtime: node
    plan: free
    rootDir: .
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @sqc/api build
    startCommand: pnpm --filter @sqc/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DISABLE_QUEUES
        value: "true"
      - key: REDIS_HOST
        value: 127.0.0.1
      - key: REDIS_PORT
        value: "6379"
      - key: OPENAI_API_KEY
        sync: false
